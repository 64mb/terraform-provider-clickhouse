version: '3'

vars:
  HOSTNAME: registry.opentofu.org
  NAMESPACE: 64mb
  NAME: clickhouse
  BINARY: terraform-provider-{{.NAME}}
  VERSION: 0.0.0
  OS_ARCH: linux_amd64
  OS_ARCH_DARWIN: darwin_arm64

tasks:
  test-acc:
    desc: Run acceptance tests
    env:
      TF_ACC: 1
      TF_CLICKHOUSE_HOST: '127.0.0.1'
      TF_CLICKHOUSE_USERNAME: 'default'
      TF_CLICKHOUSE_PASSWORD: ''
      TF_CLICKHOUSE_PORT: 9000
    cmds:
      - go test -tags testing ./... -v {{.TESTARGS}} -timeout 120m

  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BINARY}}

  release:
    desc: Build unsigned local release packages without publishing
    cmds:
      - goreleaser release --snapshot --clean --skip=publish,sign

  install:
    desc: Install the provider for Linux
    deps: [build]
    cmds:
      - mkdir -p ~/.terraform.d/plugins/{{.HOSTNAME}}/{{.NAMESPACE}}/{{.NAME}}/{{.VERSION}}/{{.OS_ARCH}}
      - mv {{.BINARY}} ~/.terraform.d/plugins/{{.HOSTNAME}}/{{.NAMESPACE}}/{{.NAME}}/{{.VERSION}}/{{.OS_ARCH}}

  install-darwin:
    desc: Install the provider for Darwin (macOS)
    deps: [build]
    cmds:
      - mkdir -p ~/.terraform.d/plugins/{{.HOSTNAME}}/{{.NAMESPACE}}/{{.NAME}}/{{.VERSION}}/{{.OS_ARCH_DARWIN}}
      - mv {{.BINARY}} ~/.terraform.d/plugins/{{.HOSTNAME}}/{{.NAMESPACE}}/{{.NAME}}/{{.VERSION}}/{{.OS_ARCH_DARWIN}}

  test:
    desc: Run unit tests
    cmds:
      - go test -race -count=1 -skip '^(TestAcc|TestIntegration)' ./... {{.TESTARGS}} -timeout=2m

  doc:
    desc: Generate documentation
    cmds:
      - go generate ./...

  test-table-integration:
    desc: Run table integration tests against a disposable local ClickHouse 25.3 on port 19000
    env:
      CLICKHOUSE_TEST_ADDR: '127.0.0.1:19000'
    cmds:
      - go test -v -count=1 ./pkg/resources/table -run '^TestIntegration' -timeout=5m

  test-table-lifecycle:
    desc: Run Terraform table lifecycle tests against the same disposable local server
    env:
      TF_ACC: '1'
      TF_CLICKHOUSE_HOST: '127.0.0.1'
      TF_CLICKHOUSE_PORT: '19000'
      TF_CLICKHOUSE_USERNAME: default
      TF_CLICKHOUSE_PASSWORD: ''
    cmds:
      - go test -v -count=1 ./pkg/resources/table -run '^TestAccTable' -timeout=5m

  release-check:
    desc: Validate the signed registry release configuration without publishing
    cmds:
      - goreleaser check

  test-table-topology:
    desc: Run Replicated and Distributed tests against the isolated Keeper fixture on port 19001
    env:
      CLICKHOUSE_TOPOLOGY_TEST_ADDR: '127.0.0.1:19001'
    cmds:
      - go test -v -count=1 ./pkg/resources/table -run '^TestIntegrationTopologyImports$' -timeout=5m
