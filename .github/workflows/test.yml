name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

env:
  CHECKPOINT_DISABLE: '1'

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - name: Unit tests without external services
        run: go test -race -count=1 -skip '^(TestAcc|TestIntegration)' ./...
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          args: check

  table-integration:
    name: ClickHouse ${{ matrix.clickhouse }} table lifecycle (${{ matrix.cli }})
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ['25.3', '25.8', '26.3', '26.8']
        cli: [terraform, opentofu]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        env:
          CLICKHOUSE_SKIP_USER_SETUP: '1'
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 19000:9000
        options: >-
          --health-cmd "clickhouse-client --query='SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        if: matrix.cli == 'terraform'
        with:
          terraform_version: '1.6.6'
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v2
        if: matrix.cli == 'opentofu'
        with:
          tofu_version: '1.13.1'
          tofu_wrapper: false
          provider_acceptance_tests: true
      - name: Table lifecycle and user and role read cleanup
        env:
          CLICKHOUSE_TEST_ADDR: '127.0.0.1:19000'
        run: go test -v -p 1 -count=1 -timeout 5m ./pkg/resources/table ./pkg/resources/db ./pkg/resources/user ./pkg/resources/role -run '^TestIntegration'
      - name: Terraform create, import, no-op refresh, update and destroy
        env:
          TF_ACC: '1'
          TF_CLICKHOUSE_HOST: '127.0.0.1'
          TF_CLICKHOUSE_PORT: '19000'
          TF_CLICKHOUSE_USERNAME: default
          TF_CLICKHOUSE_PASSWORD: ''
        run: go test -v -p 1 -count=1 -timeout 5m ./pkg/provider ./pkg/resources/table ./pkg/resources/db -run '^TestAcc(Provider|Table|Database|ResourceDb$)'
      - name: Start isolated Keeper and topology fixture
        run: |
          docker run -d --name clickhouse-provider-topology \
            -p 127.0.0.1:19001:9000 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            -v "$PWD/tests/fixtures/clickhouse-topology.xml:/etc/clickhouse-server/config.d/provider-topology.xml:ro" \
            clickhouse/clickhouse-server:${{ matrix.clickhouse }}
          for _ in $(seq 1 60); do
            if docker exec clickhouse-provider-topology clickhouse-client --query 'SELECT 1'; then
              exit 0
            fi
            sleep 1
          done
          docker logs clickhouse-provider-topology
          exit 1
      - name: Replicated and Distributed import and ALTER
        env:
          CLICKHOUSE_TOPOLOGY_TEST_ADDR: '127.0.0.1:19001'
        run: go test -v -count=1 -timeout 5m ./pkg/resources/table -run '^TestIntegrationTopologyImports$'
      - name: Remove topology fixture
        if: always()
        run: docker rm -f clickhouse-provider-topology || true

  cluster-integration:
    name: ClickHouse Cluster lifecycle (latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'
          terraform_wrapper: false
      - name: Start two ClickHouse nodes and ClickHouse Keeper
        run: docker compose -f tests/fixtures/cluster/compose.yml up -d --wait --wait-timeout 120
      - name: Cluster lifecycle and failure paths
        env:
          TF_ACC: '1'
          CLICKHOUSE_CLUSTER_TEST_ADDRS: '127.0.0.1:19002,127.0.0.1:19003'
        run: |
          go test -v -p 1 -count=1 -timeout 8m ./pkg/provider ./pkg/resources/db -run '^TestAccCluster'
          go test -v -count=1 -timeout 2m ./pkg/resources/db ./pkg/resources/table -run '^TestIntegrationCluster'
      - name: Offline node rejects incomplete DDL
        env:
          CLICKHOUSE_CLUSTER_OFFLINE_TEST_ADDR: '127.0.0.1:19002'
        run: |
          docker compose -f tests/fixtures/cluster/compose.yml stop node2
          go test -v -count=1 -timeout 1m ./pkg/resources/db ./pkg/resources/table -run '^TestIntegrationCluster(Database)?Unavailable$'
      - name: Cluster logs
        if: failure()
        run: docker compose -f tests/fixtures/cluster/compose.yml logs --no-color
      - name: Remove cluster fixture
        if: always()
        run: docker compose -f tests/fixtures/cluster/compose.yml down -v
